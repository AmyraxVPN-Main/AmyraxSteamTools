<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-label="AmyraxSteamTools">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6f957a"><animate attributeName="stop-color" values="#6f957a;#a7c4ae;#6f957a" dur="4s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#f3f7f4"><animate attributeName="offset" values="0.25;0.75;0.25" dur="4s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#8eae98"><animate attributeName="stop-color" values="#8eae98;#5e826b;#8eae98" dur="4s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="190" rx="30" fill="#0f1518"/>
<rect x="1" y="1" width="1098" height="188" rx="29" fill="none" stroke="#769781" stroke-opacity=".35"/>
<text x="550" y="92" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="750" fill="url(#g)" filter="url(#glow)">AmyraxSteamTools</text>
<text x="550" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="5" fill="#9fb2a5">ALL-IN-ONE STEAM ASSISTANT
  <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
</text>
</svg>